<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Showcase</title>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>My Media Showcase</h1>
    <p>A collection of images, audio, video, and embeds</p>
  </header>

  <main>

    <section>
      <h2>Image Gallery</h2>
      <img src="../Day5/Assets/zoho.jpg" alt="zoho" width="200" height="150">
      <img src="../Day5/Assets/images/amazon.jpg" alt="amazon" width="200" height="150">
      <img src="../Day5/Assets/images/deloite.jpg" alt="deloitte" width="200" height="150">
    </section>

    <section>
      <h2>Audio Player</h2>
      <audio controls>
        <source src="assets/audio1.mp3" type="audio/mpeg">
        <source src="assets/audio1.mp3" type="audio/ogg">
      </audio>
    </section>

    <section>
      <h2>Video Player</h2>
      <video width="640" height="360" controls poster="poster.jpg">
        <source src="assets/v1.mp4" type="video/mp4">
        <source src="assets/v1.mp4" type="video/webm">
      </video>
    </section>

    <section>
      <h2>YouTube Video</h2>
      <iframe width="560" height="315" 
              src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
              title="YouTube video player" 
              frameborder="0" 
              allowfullscreen>
      </iframe>
    </section>

    <section>
      <h2>Google Map</h2>
      <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3916.469158785!2d80.2707!3d13.0827!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5265d1f1f1f1f1%3A0x123456789abcdef!2sChennai%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
              width="600" 
              height="450" 
              style="border:0;" 
              allowfullscreen="" 
              loading="lazy">
      </iframe>
    </section>

    <section>
      <h2>Embedded PDF</h2>
      <iframe src="assets/pdf1.pdf" width="600" height="400"></iframe>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 My Media Showcase</p>
  </footer>

</body>
</html>
