<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio File</title>
</head>
<body>
    <section>
        <div>
            <h2>Audio_1</h2>
            <audio controls autoplay loop>
                <source src="assets/audio1.mp3"alt="audio.mp3"/>
            </audio>
        </div>
    </section>
    <section>
        <div>
            <h2>Audio_2</h2>
            <audio controls loop preload="auto">
                <source src="assets/a2.mpeg"alt="audio2.mp3"/>
            </audio>
        </div>
    </section>
</body>
</html>
