<!-- Login Form -->
<form action="" method="post">
  <h2>Login Form</h2>
  <label for="username">Username:</label>
  <input type="text" id="username" name="username" required><br><br>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" required><br><br>

  <button type="submit">Login</button>
</form>

<hr>

<!-- Registration Form -->
<form action=" method="post">
  <h2>Registration Form</h2>
  <label for="fullname">Full Name:</label>
  <input type="text" id="fullname" name="fullname" required><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br><br>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" required><br><br>

  <label for="confirm">Confirm Password:</label>
  <input type="password" id="confirm" name="confirm" required><br><br>

  <button type="submit">Register</button>
</form>

<hr>

<!-- Contact Form -->
<form action=" method="post">
  <h2>Contact Form</h2>
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br><br>

  <label for="message">Message:</label><br>
  <textarea id="message" name="message" rows="5" cols="30" required></textarea><br><br>

  <button type="submit">Send</button>
</form>

<hr>

<!-- Feedback Form -->
<form action="" method="post">
  <h2>Feedback Form</h2>
  <label for="name">Name:</label>
  <input type="text" id="name" name="name"><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email"><br><br>

  <label for="feedback">Your Feedback:</label><br>
  <textarea id="feedback" name="feedback" rows="5" cols="30" required></textarea><br><br>

  <button type="submit">Submit Feedback</button>
</form>

<hr>

<!-- Job Application Form -->
<form action=" method="post">
  <h2>Job Application Form</h2>
  <label for="fullname">Full Name:</label>
  <input type="text" id="fullname" name="fullname" required><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br><br>

  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" required><br><br>

  <label for="resume">Resume (Paste Text):</label><br>
  <textarea id="resume" name="resume" rows="8" cols="40" required></textarea><br><br>

  <label for="cover">Cover Letter:</label><br>
  <textarea id="cover" name="cover" rows="8" cols="40"></textarea><br><br>

  <button type="submit">Apply</button>
</form>
