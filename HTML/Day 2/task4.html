<!DOCTYPE html>
<html>
<head>
    <title>HTML Interactive Tags Demo</title>
</head>
<body>
    <h1>Interactive HTML Tags</h1>

    <!-- Button -->
    <button type="button">Click Me</button>

    <!-- Form with input types -->
    <form>
        <p><label for="text">Text Input:</label>
        <input type="text" id="text" name="text"></p>

        <p><label for="password">Password:</label>
        <input type="password" id="password" name="password"></p>

        <p><label for="email">Email:</label>
        <input type="email" id="email" name="email"></p>

        <p><label for="number">Number:</label>
        <input type="number" id="number" name="number"></p>

        <p><label for="date">Date:</label>
        <input type="date" id="date" name="date"></p>

        <p><label for="color">Color Picker:</label>
        <input type="color" id="color" name="color"></p>

        <p><label for="range">Range Slider:</label>
        <input type="range" id="range" name="range" min="0" max="100"></p>

        <p><label for="file">File Upload:</label>
        <input type="file" id="file" name="file"></p>

        <p><label for="checkbox">Checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox"> Accept Terms</p>

        <p><label for="radio1">Radio Button:</label>
        <input type="radio" id="radio1" name="radio"> Option 1
        <input type="radio" id="radio2" name="radio"> Option 2</p>

        <p><label for="select">Dropdown:</label>
        <select id="select" name="select">
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
        </select></p>

        <p><label for="textarea">Textarea:</label><br>
        <textarea id="textarea" name="textarea" rows="4" cols="40"></textarea></p>

        <p><input type="submit" value="Submit"></p>
    </form>

    <!-- Interactive media -->
    <p>Audio Control:</p>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <p>Video Control:</p>
    <video width="320" height="240" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Details and summary -->
    <p>Expandable Section:</p>
    <details>
        <summary>Click to expand</summary>
        <p>This is hidden content revealed when you expand.</p>
    </details>

    <!-- Progress and meter -->
    <p>Progress Bar:</p>
    <progress value="70" max="100"></progress>

    <p>Meter:</p>
    <meter value="0.6">60%</meter>
</body>
</html>
