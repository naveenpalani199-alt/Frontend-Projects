<!DOCTYPE html>
<html>
<head>
    <title>HTML Elements Demo</title>
</head>
<body>
    <!-- Heading -->
    <h1>This is a Heading</h1>

    <!-- Paragraph -->
    <p>This is a paragraph of text that introduces the content.</p>

    <!-- Bold Text -->
    <p>This is <b>bold text</b> inside a sentence.</p>

    <!-- Italic Text -->
    <p>This is <i>italic text</i> inside a sentence.</p>

    <!-- Highlighted Text -->
    <p>This is <mark>highlighted text</mark> inside a sentence.</p>

    <!-- Button -->
    <button>Click Me</button>

    <!-- Input Field -->
    <p><input type="text" placeholder="Enter your name"></p>

    <!-- Dropdown -->
    <p>
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
            <option>Option 3</option>
        </select>
    </p>

    <!-- Textarea -->
    <p>
        <textarea rows="4" cols="40">Write something here...</textarea>
    </p>
</body>
</html>
