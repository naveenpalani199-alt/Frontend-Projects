<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Code Brackets Accent -->
  <path d="M 65 65 L 35 100 L 65 135" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 135 65 L 165 100 L 135 135" fill="none" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 115 55 L 85 145" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" />

  <!-- Center JS Badge -->
  <rect x="70" y="75" width="60" height="50" rx="8" fill="#10b981" />
  <text x="100" y="110" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">JS</text>
</svg>
