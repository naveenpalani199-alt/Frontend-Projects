<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task3</title>
  <style>
    .card {
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card h3 {
      margin: 10px 0;
    }

    .details {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.5s ease;
      padding: 0 10px;
    }

    .details.show {
      max-height: 200px; /* enough space for text */
      opacity: 1;
      padding: 10px;
    }

    button {
      margin: 10px;
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="assets/images/zoho.jpg" alt="Card Image">
    <h3>Zoho</h3>
    <button id="toggleBtn">Show Details</button>
    <p id="details" class="details">
       This is Zoho developed a world- class, highly secured and local ‘no code- no source’ platform like SKYLine for the Indian customers, underlining the unmatched prowess of Indian technological innovation, having international adaptability."
    </p>
  </div>

  <script src="assets/task3.js">
   
  </script>

</body>
</html>
