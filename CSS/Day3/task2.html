<!DOCTYPE html>
<html>
<head>
  <style>
    html{
        scroll-behavior: smooth;
    }
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .product-card {
      width: 320px;
      height: auto;
      padding: 20px;
      border: 3px solid #ff4500; 
      margin: 30px auto;
      background-color: #f9f9f9;
      text-align: center;
      border-radius: 12px;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
    }

    .product-card img {
      width: 200px;
      height: 200px;
      border: 2px solid #008000; 
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .product-card h2 {
      margin: 10px 0;
      color: #333;
    }

    .product-card h3 {
      margin: 5px 0;
      color: #ff0000;
    }

    .product-card p {
      margin: 10px 0;
      font-size: 15px;
      color: #555;
    }

    .product-card button {
      padding: 10px 20px;
      border: 2px solid #0000ff; 
      background-color: #0000ff;
      color: #fff;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .product-card button:hover {
      background-color: #333;
      border-color: #333;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <img src="assets/headph.jpg" alt="Product Image">
    <h2>Wireless Headphones</h2>
    <h3>₹2,999</h3>
    <p>High-quality wireless headphones with noise cancellation and 20 hours battery life.</p>
    <button>Buy Now</button>
  </div>

</body>
</html>
