<!DOCTYPE html>
<html>
<head>
    <title>College Departments</title>
    <style>
        .department {
            width: 250px;
            height: 120px;
            text-align: center;
            color: white;
            margin: 15px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            border-radius: 10px;
            font-size: 18px;
        }
        .cse {
            background-color: rgb(243, 88, 88); 
        }
        .it {
            background-color: darkblue 
        }
        .ece {
            background-color: rgb(223, 117, 242)
        }
        .eee {
            background-color: #3bda26; 
        }
        .mech {
            background-color: rgb(156, 161, 165)  
        }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#333;">Engineering Departments</h1>

    <div class="department cse">CSE - Computer Science Engineering</div>
    <div class="department it">IT - Information Technology</div>
    <div class="department ece">ECE - Electronics & Communication Engineering</div>
    <div class="department eee">EEE - Electrical & Electronics Engineering</div>
    <div class="department mech">MECH - Mechanical Engineering</div>
</body>
</html>
