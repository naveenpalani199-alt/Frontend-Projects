<!DOCTYPE html>
<html>
<head>
    <title>Five Colored Boxes</title>
    <style>
        .box {
            width: 250px;
            height: 120px;
            text-align: center;
            margin: 15px auto;
            padding: 10px;
            border-radius: 8px;
        }
        .box3 {
            background-color: #0066cc; 
            color: white;
        }
        .box4 {
            background-color: #800080; 
            color: white;
        }
        .box5 {
            background-color: #cc0000;
            color: white;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#333;">Five Colored Boxes</h1>

    <div style="background-color:#ffcc00; color:#333; width:250px; height:120px; text-align:center; margin:15px auto; padding:10px; border-radius:8px;">
        <h2>Box 1</h2>
        <p>This is the first box using inline CSS.</p>
    </div>

    <div style="background-color:#009933; color:white; width:250px; height:120px; text-align:center; margin:15px auto; padding:10px; border-radius:8px;">
        <h2>Box 2</h2>
        <p>This is the second box using inline CSS.</p>
    </div>

    <div class="box box3">
        <h2>Box 3</h2>
        <p>This is the third box using internal CSS.</p>
    </div>

    <div class="box box4">
        <h2>Box 4</h2>
        <p>This is the fourth box using internal CSS.</p>
    </div>

    <div class="box box5">
        <h2>Box 5</h2>
        <p>This is the fifth box using internal CSS.</p>
    </div>
</body>
</html>
